name: Demo Pipeline — Unified Commerce Lakehouse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - "transformations/**"
      - "quality/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/demo-pipeline.yml"

concurrency:
  group: demo-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run Bronze → Silver → Gold + DQ
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${{ secrets.MINIO_CI_PASSWORD }}
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_CI_PASSWORD }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Start MinIO
        run: |
          docker run -d \
            --name lakehouse-minio-ci \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

      - name: Create lakehouse buckets
        run: |
          docker run --rm --network host minio/mc:latest \
            alias set ci http://localhost:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          docker run --rm --network host minio/mc:latest mb --ignore-existing ci/bronze
          docker run --rm --network host minio/mc:latest mb --ignore-existing ci/silver
          docker run --rm --network host minio/mc:latest mb --ignore-existing ci/gold

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic source data
        run: python scripts/generate_synthetic_data.py

      - name: Run Bronze ingestion
        run: python ingestion/bronze_ingestion.py

      - name: Run Bronze data quality checks
        run: python quality/bronze_expectations.py

      - name: Run Silver transformations
        run: python transformations/silver_transformations.py

      - name: Run Silver data quality checks
        run: python quality/silver_expectations.py

      - name: Run Gold transformations
        run: python transformations/gold_transformations.py

      - name: Export Gold tables as CI artifacts
        run: |
          mkdir -p ci-output/gold
          python - <<'PY'
          import os
          from deltalake import DeltaTable

          storage = {
              "endpoint_url": os.environ["MINIO_ENDPOINT"],
              "access_key_id": os.environ["MINIO_ACCESS_KEY"],
              "secret_access_key": os.environ["MINIO_SECRET_KEY"],
              "allow_http": "true",
              "aws_region": "us-east-1",
          }

          tables = [
              "revenue_mart",
              "channel_performance_mart",
              "customer_360_mart",
              "inventory_turnover_mart",
          ]

          for table in tables:
              dt = DeltaTable(f"s3://gold/{table}", storage_options=storage)
              df = dt.to_pandas()
              path = f"ci-output/gold/{table}.csv"
              df.to_csv(path, index=False)
              print(f"Exported {table}: {len(df)} rows")
          PY

      - name: Write pipeline metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          metadata = {
              "pipeline_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "status": "success",
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "execution_mode": "github_actions_ci",
          }

          with open("ci-output/pipeline_run.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY

      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: lakehouse-demo-run-${{ github.run_number }}
          path: ci-output/
          retention-days: 7

      - name: Cleanup MinIO
        if: always()
        run: docker rm -f lakehouse-minio-ci || true
